<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gibiraa | Magaalaa Bulbulaa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;color:#222}
.container{max-width:600px;margin:0 auto;padding:0 20px}
header{background:#111;color:#fff;padding:14px 0;border-bottom:4px solid #c8102e}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-weight:700}.logo span{color:#ff4d6d}
nav a{color:#ddd;text-decoration:none;padding:7px 12px;border-radius:6px}
nav a:hover{background:#c8102e}
.page{background:#111;color:#fff;padding:35px 0;text-align:center;border-bottom:4px solid #c8102e}
.box{background:#fff;margin:30px auto;padding:28px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.07);border-top:5px solid #c8102e}
label{display:block;margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:11px;border:1.5px solid #ccc;border-radius:8px;margin-bottom:14px}
button{width:100%;padding:13px;background:#c8102e;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;margin-top:12px;padding:10px;background:#d1e7dd;color:#0f5132;border-radius:8px;text-align:center}
.err{background:#f8d7da;color:#842029}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <div class="logo">Magaalaa <span>Bulbulaa</span></div>
    <nav>
      <a href="tajaajila.html">Tajaajila</a>
      <a href="haala-iyyataa.html">Haala Iyyataa</a>
      <a href="login.html" id="logoutBtn">Logout</a>
    </nav>
  </div>
</header>

<div class="page"><div class="container"><h1>Gibiraa Kaffaluu</h1></div></div>

<div class="container">
  <div class="box">
    <form id="form">
      <label>Gosa Gibiraa *</label>
      <select id="gosa" required>
        <option value="">Filadhu</option>
        <option value="Gibiraa Lafa">Gibiraa Lafa</option>
        <option value="Gibiraa Daldala">Gibiraa Daldala</option>
        <option value="Kan biroo">Kan biroo</option>
      </select>
      <label>Maallaqa (ETB) *</label>
      <input type="number" id="maallaqa" required min="1">
      <label>Nagahee Upload (Suuraa) *</label>
      <input type="file" id="nagahee" accept="image/*" required>
      <button type="submit" id="btn">Galchi</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
  var user = null;
  try { user = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) {}
  if (!user) {
    alert("Dura Login godhi!");
    location.href = 'login.html';
  }

  document.getElementById('logoutBtn').onclick = function (e) {
    e.preventDefault();
    localStorage.removeItem('currentUser');
    location.href = 'login.html';
  };

  var sb = window.supabase.createClient(
    'https://wjfvluhjgsvrzkhuzaoi.supabase.co',
    'sb_publishable_X5froRQvVq1pFxVXZa3p3w_c5ptm_Bs'
  );

  document.getElementById('form').onsubmit = async function (e) {
    e.preventDefault();
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');
    var file = document.getElementById('nagahee').files[0];
    if (!file) {
      alert('Nagahee upload godhi!');
      return;
    }

    msg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Eegaa...';

    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var res = await sb.from('gibiraa').insert([{
          maqaa: user.maqaa,
          bilbila: user.bilbila,
          gosa: document.getElementById('gosa').value,
          maallaqa: String(document.getElementById('maallaqa').value),
          nagahee: reader.result,
          haala: 'Eegaa'
        }]).select();if (res.error) {
          msg.className = 'msg err';
          msg.style.display = 'block';
          msg.textContent = res.error.message;
          btn.disabled = false;
          btn.textContent = 'Galchi';
          return;
        }

        msg.className = 'msg';
        msg.style.display = 'block';
        msg.textContent = "Gibiraan galma'eera! Admin ni mirkaneessa.";
        document.getElementById('form').reset();
        btn.disabled = false;
        btn.textContent = 'Galchi';
      } catch (err) {
        msg.className = 'msg err';
        msg.style.display = 'block';
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Galchi';
      }
    };
    reader.readAsDataURL(file);
  };
</script>
</body>
</html>
