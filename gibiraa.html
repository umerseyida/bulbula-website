<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gibiraa | Magaalaa Bulbulaa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui;background:#f0f2f5;min-height:100vh}
header{background:#111;color:#fff;padding:14px 16px;border-bottom:4px solid #c8102e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:700}.logo span{color:#ff4d6d}
header a{color:#ddd;text-decoration:none;font-size:0.9rem;padding:6px 10px;border-radius:6px}
header a:hover{background:#c8102e}
.wrap{max-width:480px;margin:24px auto;padding:0 14px 40px}
.card{background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,0.08);border-top:5px solid #c8102e}
.card h1{font-size:1.3rem;text-align:center;margin-bottom:6px}
.hello{text-align:center;color:#666;font-size:0.95rem;margin-bottom:20px}
label{display:block;font-weight:600;font-size:0.92rem;margin:14px 0 6px}
label span{color:#c8102e}
input,select{width:100%;padding:13px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:1rem;background:#fafafa}
input:focus,select:focus{outline:none;border-color:#c8102e;background:#fff}
button{width:100%;margin-top:20px;padding:14px;background:#c8102e;color:#fff;border:none;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer}
button:disabled{opacity:0.6}
.links{text-align:center;margin-top:16px;font-size:0.9rem}
.links a{color:#c8102e;text-decoration:none;margin:0 6px;font-weight:600}
.msg{display:none;margin-top:14px;padding:12px;border-radius:8px;text-align:center}
.ok{background:#d1e7dd;color:#0f5132}
.err{background:#f8d7da;color:#842029}
.hint{font-size:0.8rem;color:#888;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="logo">Magaalaa <span>Bulbulaa</span></div>
  <div>
    <a href="tajaajila.html">Tajaajila</a>
    <a href="iyyata.html">Iyyata</a>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <h1>Gibiraa Kaffaluu</h1>
    <p class="hello" id="hi">Nagaa</p>
    <form id="f">
      <label>Gosa Gibiraa <span>*</span></label>
      <select id="gosa" required>
        <option value="">Filadhu</option>
        <option value="Gibiraa Lafa">Gibiraa Lafa</option>
        <option value="Qabeenya Dhaabbataa">Qabeenya Dhaabbataa</option>
        <option value="Gibiraa Daldala">Gibiraa Daldala</option>
        <option value="Kan biroo">Kan biroo</option>
      </select>
      <label>Maallaqa (ETB) <span>*</span></label>
      <input type="number" id="maallaqa" required min="1" placeholder="Fakkeenya: 500">
      <label>Nagahee (suuraa) <span>*</span></label>
      <input type="file" id="nagahee" accept="image/*" required>
      <p class="hint">Suuraa xixiqqoo (1MB gadi) upload godhi</p>
      <button type="submit" id="btn">Galchi</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="links">
      <a href="tajaajila.html">Tajaajila</a> |
      <a href="haala-iyyataa.html">Haala Iyyataa</a>
    </p>
  </div>
</div>
<script>
var raw = localStorage.getItem("currentUser");
var u = null;
try { u = raw ? JSON.parse(raw) : null; } catch (e) {}
if (!u) { alert("Dura Login godhi"); location.href = "login.html"; }
document.getElementById("hi").textContent = "Nagaa, " + (u.maqaa || "");

document.getElementById("f").onsubmit = async function (e) {
  e.preventDefault();
  var gosa = document.getElementById("gosa").value;
  var maallaqa = document.getElementById("maallaqa").value;
  var file = document.getElementById("nagahee").files[0];
  var btn = document.getElementById("btn");var msg = document.getElementById("msg");
  if (!gosa  !maallaqa  !file) {
    alert("Hunda guuti");
    return;
  }
  if (file.size > 900000) {
    alert("Suuraan guddaa dha. Xiqqeessi (1MB gadi)");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Eegaa...";
  msg.style.display = "none";

  var reader = new FileReader();
  reader.onload = async function () {
    try {
      var client = window.supabase.createClient(
        "https://wjfvluhjgsvrzkhuzaoi.supabase.co",
        "sb_publishable_X5froRQvVq1pFxVXZa3p3w_c5ptm_Bs"
      );
      var res = await client.from("gibiraa").insert([{
        maqaa: u.maqaa || "",
        bilbila: u.bilbila || "",
        gosa: gosa,
        maallaqa: String(maallaqa),
        nagahee: reader.result,
        haala: "Eegaa"
      }]).select();
      if (res.error) {
        msg.className = "msg err";
        msg.style.display = "block";
        msg.textContent = res.error.message;
        btn.disabled = false;
        btn.textContent = "Galchi";
        return;
      }
      msg.className = "msg ok";
      msg.style.display = "block";
      msg.textContent = "Gibiraan galma'eera! Admin ni mirkaneessa.";
      document.getElementById("f").reset();
      btn.disabled = false;
      btn.textContent = "Galchi";
    } catch (err) {
      msg.className = "msg err";
      msg.style.display = "block";
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Galchi";
    }
  };
  reader.readAsDataURL(file);
};
</script>
</body>
</html>
