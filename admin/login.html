<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Magaalaa Bulbulaa</title>
<style>
body{font-family:system-ui;background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.card{background:#fff;padding:35px;border-radius:14px;width:100%;max-width:380px;border-top:5px solid #c8102e}
h2{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#666;margin-bottom:20px;font-size:.95rem}
label{display:block;font-weight:600;margin-bottom:4px}
input{width:100%;padding:11px;margin-bottom:12px;border:1.5px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#c8102e;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.err{display:none;margin-top:10px;padding:10px;background:#f8d7da;color:#842029;border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2>Admin Login</h2>
  <p class="sub">Magaalaa Bulbulaa</p>
  <label>Username</label>
  <input type="text" id="user" value="admin" autocomplete="username">
  <label>Password</label>
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
  <button type="button" id="btn">Seeni</button>
  <div id="err" class="err"></div>
</div>
<script>
document.getElementById("btn").onclick = function () {
  var u = document.getElementById("user").value.trim();
  var p = document.getElementById("pass").value;
  var saved = localStorage.getItem("admin_password") || "umer seyida";
  var err = document.getElementById("err");

  if (u === "admin" && p === saved) {
    localStorage.setItem("admin", "true");
    location.href = "dashboard.html";
  } else {
    err.style.display = "block";
    err.textContent = "Username yookiin Password dogoggoraa dha!";
  }
};

document.getElementById("pass").onkeydown = function (e) {
  if (e.key === "Enter") document.getElementById("btn").click();
};
</script>
</body>
</html>
