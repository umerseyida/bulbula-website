<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print | Magaalaa Bulbulaa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;padding:20px}
.paper{max-width:700px;margin:0 auto;background:#fff;padding:40px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.header{text-align:center;border-bottom:3px solid #c8102e;padding-bottom:15px;margin-bottom:25px}
.btn{display:block;width:100%;padding:12px;background:#c8102e;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:20px}
@media print{.no-print{display:none}.paper{box-shadow:none}}
</style>
</head>
<body>
<div class="no-print" style="text-align:center;margin-bottom:15px">
  <a href="haala-iyyataa.html">← Deebi'i</a>
</div>
<div class="paper" id="paper">
  <div class="header">
    <h1>Magaalaa Bulbulaa</h1>
    <p>Waraqaa Ragaalee Ofiishalaa</p>
  </div>
  <div id="content"><p>Loading...</p></div>
  <button class="btn no-print" onclick="window.print()">Print Godhi</button>
</div>
<script>
var user = null;
try { user = JSON.parse(localStorage.getItem('currentUser')||'null'); } catch(e){}
if (!user) location.href = 'login.html';

var id = new URLSearchParams(location.search).get('id');
var sb = window.supabase.createClient(
  'https://wjfvluhjgsvrzkhuzaoi.supabase.co',
  'sb_publishable_X5froRQvVq1pFxVXZa3p3w_c5ptm_Bs'
);

(async function(){
  var res = await sb.from('iyyatota').select('*').eq('id', id).maybeSingle();
  var x = res.data;
  if (!x || x.haala !== 'Fudhatame') {
    document.getElementById('content').innerHTML =
      '<p style="color:#c8102e">Iyyatni hin fudhatamne. Print hin dandeessu.</p>';
    return;
  }
  if (x.bilbila !== user.bilbila) {
    document.getElementById('content').innerHTML = '<p style="color:#c8102e">Iyyata kee miti.</p>';
    return;
  }
  document.getElementById('content').innerHTML =
    '<p><strong>Maqaa:</strong> '+x.maqaa+'</p>'+
    '<p><strong>Bilbila:</strong> '+x.bilbila+'</p>'+
    '<p><strong>Gosa Iyyataa:</strong> '+x.gosa_iyyataa+'</p>'+
    '<p><strong>Teessoo:</strong> '+(x.teessoo||'-')+'</p>'+
    '<p><strong>Ibsa:</strong> '+x.ibsa+'</p>'+
    '<p><strong>Haala:</strong> Fudhatame (Mirkanaa\'eera)</p>'+
    '<p style="margin-top:30px;text-align:center;color:#666;font-size:.9rem">Magaalaa Bulbulaa — Waraqaa ofiishalaa</p>';
})();
</script>
</body>
</html>
