<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beeksisa | Magaalaa Bulbulaa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f5;color:#222}
.container{max-width:900px;margin:0 auto;padding:0 20px}
header{background:#111;color:#fff;padding:14px 0;border-bottom:4px solid #c8102e}
.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:700}.logo span{color:#ff4d6d}
nav a{color:#ddd;text-decoration:none;padding:7px 12px;border-radius:6px;font-size:.92rem}
nav a:hover{background:#c8102e;color:#fff}
.page{background:#111;color:#fff;padding:40px 0;text-align:center;border-bottom:4px solid #c8102e}
.card{background:#fff;padding:20px;border-radius:12px;margin:16px 0;border-left:5px solid #c8102e;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.card h3{margin-bottom:6px}
.date{font-size:.85rem;color:#666;margin-bottom:8px}
footer{text-align:center;padding:20px;color:#666;font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <div class="logo">Magaalaa <span>Bulbulaa</span></div>
    <nav>
      <a href="index.html">Fuula Dursa</a>
      <a href="tajaajila.html">Tajaajila</a>
      <a href="beeksisa.html">Beeksisa</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>
<div class="page">
  <div class="container"><h1>Beeksisa Magaalaa</h1><p>Odeeffannoo haaraa</p></div>
</div>
<div class="container" id="list" style="padding:30px 20px"></div>
<footer>&copy; 2026 Magaalaa Bulbulaa</footer>
<script>
  var raw = localStorage.getItem('beeksisa');
  var beeksisa = [];
  try { beeksisa = raw ? JSON.parse(raw) : []; } catch (e) {}
  var list = document.getElementById('list');
  if (beeksisa.length === 0) {
    list.innerHTML = '<p style="text-align:center;padding:40px;color:#666">Beeksisa amma hin jiru</p>';
  } else {
    var html = '';
    for (var i = beeksisa.length - 1; i >= 0; i--) {
      html += '<div class="card"><h3>' + beeksisa[i].mataduree + '</h3>';
      html += '<div class="date">' + beeksisa[i].guyyaa + '</div>';
      html += '<p>' + beeksisa[i].qabiyyee + '</p></div>';
    }
    list.innerHTML = html;
  }
</script>
</body>
</html>
